# Fails a push or pull request when any model-free repo check fails: stale knowledge catalog
# views, a reference file without its manifest row or provenance header, a house rule that
# outgrew its hook slots or the Antigravity caps, a broken harness manifest, an OpenCode plugin
# that registers less than it should, or a drifted INSTALL.md. Same script as .githooks/pre-commit,
# for contributors who never enabled that hook. No model calls, no secrets.
name: knowledge-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run every model-free check
        run: bash scripts/check.sh
