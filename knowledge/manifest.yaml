# knowledge/manifest.yaml — the single source of truth for what the rockrms plugin documents.
#
# One entry per reference file, or per coverage claim (file: null). Fields:
#   id            lowercase-hyphen, unique
#   category      one of the category ids listed in knowledge/render.py (CATEGORY_LABELS); unknown ids still render
#   title         human title used in the rendered views
#   skill         owning skill directory name, or null for a plugin-root file such as rules/*.md
#   file          path relative to the skill (or to the plugin root when skill is null); null for a coverage claim
#   source_url    where the knowledge came from, or null when none was recorded
#   rock_version  the Rock version it was verified on: v18.2.4, v18.2, unknown, or n/a for house conventions
#   tier          measured | traced | summarized   (CONTRIBUTING.md defines the evidence each needs)
#   status        current | roadmap
#   added         the CHANGELOG.md release date (YYYY-MM-DD) the entry shipped in
#   notes         one sentence of provenance detail; say 'not recorded' rather than guess
#
# Format: a flat list of flat mappings — python3 knowledge/render.py parses it without PyYAML.
# Quote a value in double quotes when it contains ': ' or starts with a special character.
# After editing: python3 knowledge/render.py   (and --check before committing; the pre-commit hook runs it).

